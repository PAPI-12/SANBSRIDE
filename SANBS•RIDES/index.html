<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1116" />
    <meta name="description" content="SANBS RIDE — book and coordinate donor transport to SANBS donation centres." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="SANBS RIDE · Donor transport" />
    <meta property="og:description" content="Book and coordinate donor transport to SANBS donation centres." />
    <title>SANBS RIDE · Donor transport</title>
  </head>
  <body>
    <noscript><p style="font:600 16px/1.5 Inter,system-ui,sans-serif;padding:24px;text-align:center">SANBS RIDE needs JavaScript to run. Please enable it in your browser and reload.</p></noscript>
    <div id="root">
      <main data-boot-fallback style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f1e9;color:#16191f;font:600 16px/1.5 Inter,system-ui,sans-serif">
        Loading SANBS RIDE…
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        if (document.documentElement.dataset.sanbsAppReady === 'true') return;
        var fallback = document.querySelector('[data-boot-fallback]');
        if (!fallback) return;
        fallback.innerHTML = '<strong>SANBS RIDE did not finish loading.</strong><span style="max-width:460px;margin-top:8px;color:#565d65;font-weight:400;text-align:center">Reload the preview. If it happens again, open the browser console and share the first error.</span>';
        fallback.style.display = 'flex';
        fallback.style.flexDirection = 'column';
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
